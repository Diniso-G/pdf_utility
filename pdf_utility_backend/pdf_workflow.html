<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PDF Utility Tool</title>
        <style>
            :root {
                --bg-start: #3b1c78;
                --bg-end: #7a3bc8;
                --ink: #2b2140;
                --lavender: #cdb9f0;
                --label: #c4a6f2;
                --muted: #8063bc;
                --warn-bg: #faeeda;
                --warn-ink: #633806;
                --err: #b3261e;
                --ok: #1f7a4d;
            }
            * {box-sizing: border-box;}
            html {min-height: 100%;background: var(--bg-end);}
            body {margin: 0; min-height: 100vh; color: var(--ink); font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialised;}
            h1 {margin: 0;font-size: 20px; font-weight: 700; color: #fff;}
            .app {max-width: 480px; margin: 0 auto; padding: 40px 16px 32px;}
            .tagline {margin: 2px 0 0; font-size: 13px; color: var(--lavender);}
            .section-label {display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 10px; font-size: 11px; letter-spacing: 0.08em; color: var(--label);}
            .section-label.spaced {margin-top: 6px;}
            .status {display: inline-flex;align-items: center;gap: 6px;padding: 0; border: 0;background: none;cursor: pointer; font: inherit;font-size: 11px;letter-spacing:  0; color: var(--lavender);}
            .card {width: 100%; max-width: 800px;margin: auto;}
            .small_card {box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);background-color: blue; padding: 20px; margin: 15px 0; border-radius: 10px;}
            button {padding: 8px 15px; cursor: pointer;}
            input{padding:8px; margin: 5px 0;}
        </style>
    </head>
    <body>
        <main class="app">
            <header class="header">
                <div>
                    <h1> PDF Utility Tool</h1>
                    <p class="tagline">Select, Add Numbers, Merge & Split</p>
                </div>
            </header>

            <p class="section-label">ACTIONS</p>
            <label class="card action" for="pdfInput">
                <span class="action-title">Select PDFs</span>
                <span class="action-sub" id="pdfSub">Choose one or more PDF files</span>
                <input class="sr-only" type="file" id="pdfInput" accept="application/pdf,.pdf" multiple>
            </label>

            <button class="card action" type="button" id="btnNumbers">
                <span class="action-title">Add page numbers</span>
                <span class="action-sub">Number every page of the selected PDF</span>
            </button>

            <button class="card action" type="button" id="btnMerge">
                <span class="action-title">Merge PDFs</span>
                <span class="action-sub">Combine the selected PDFs into one, in the order chosen</span>
            </button>

            <button class="card action" type="button" id="btnSplit">
                <span class="action-title">Split PDF</span>
                <span class="action-sub">Seperate the PDF into individual pages</span>
            </button>

            <div class="section-label spaced">
                <span>WORD TO PDF (REQUIRES SERVER)</span>
                <button class="status" type="button" id="serverStatus" title="Check the server again">
                    <span class="dot" id="serverDot"></span><span id="serverText">Checking server...</span>
                </button>
            </div>

            <label class="card action" for="wordInput">
                <span class="action-title">Select Word Document</span>
                <span class="action-sub" id="wordSub">Choose a .docx file to convert</span>
                <input class="sr-only" type="file" id="wordInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            </label>

            <button class="card action" type="button" id="btnConvert">
                <span class="action-title">Convert to PDF</span>
                <span class="action-sub">Send the file to your sever for conversion</span>
            </button>
        
            <div class="card warning">
                <p>Download or save your files after splitting before continuing.</p>
            </div>

            <div class="card" id="resultCard">
                <p id="resultText" role="status" aria-live="polite">Results will appear after action.</p>
                <div class="links" id="resultLinks"></div>
            </div>
        </main>
        <script>
            let uploadedFilename ='';
            let processedFilename ='';

            async function uploadPDF() {
                const fileInput = document.getElementById('pdfFile');
                const resultEl = document.getElementById('uploadResult');

                if (!fileInput.files.length){
                    resultEl.innerText = 'Please select a PDF.';
                    return;
                }
                const formData = new FormData();
                formData.append('pdf', fileInput.files[0]);
                
                try {
                    const response= await fetch('http://localhost:3001/api/pdf/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    uploadedFilename = data.file;
                    resultEl.innerText = `Uploaded successfully: ${uploadedFilename}`;
                    document.getElementById('processResult').innerText = '';
                    document.getElementById('downloadLink').style.display = 'none';
                } catch (err) {
                    resultEl.innerText = 'Upload error:' + err.message;
                }
            }

            async function compressPDF() {
                const resultEl = document.getElementById('processResult');

                if (!uploadedFilename){
                    resultEl.innerText = 'No File uploaded yet.';
                    return;
                }
                
                try {
                    const response= await fetch('http://localhost:3001/api/pdf/process', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body:JSON.stringify({filename: uploadedFilename})
                    });
                    const data = await response.json();

                    if (data.error) {
                        resultEl.innerText = `Processing error: ${data.error}`;
                        return;
                    }
                    processedFilename = data.file;
                    resultEl.innerText = `Processed ${processedFilename}`;
                    const downloadLink = document.getElementById('downloadLink');
                    downloadLink.href = `http://localhost:3001/uploads/${processedFilename}`;
                    downloadLink.style.display = 'inline';
                } catch (err) {
                    resultEl.innerText = 'Processing error:' + err.message;
                }
            }

            async function mergePDF() {
                const resultEl = document.getElementById('mergeResult');
                const filesInput = document.getElementById('mergeFiles').value.trim();

                if (!filesInput){
                    resultEl.innerText = 'Enter file names to merge.';
                    return;
                }
                const files = filesInput.split(',').map(f => f.trim());

                try {
                    const response= await fetch('http://localhost:3001/api/pdf/merge', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body:JSON.stringify({files})
                    });
                    const data = await response.json();
                    resultEl.innerText = `Merged PDF: ${data.file}`;
                    const downloadLink = document.getElementById('downloadLink');
                    downloadLink.href = `http://localhost:3001/uploads/${data.file}`;
                    downloadLink.style.display = 'inline';
                } catch (err) {
                    resultEl.innerText = 'Merge error:' + err.message;
                }
            }

            async function splitPDF() {
            
                const resultEl = document.getElementById('splitResult');
                const filename = document.getElementById('splitFile').value.trim();

                if (!filename){
                    resultEl.innerText = 'Enter file name to split.';
                    return;
                }
                
                try {
                    const response= await fetch('http://localhost:3001/api/pdf/split', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body:JSON.stringify({filename})
                    });
                    const data = await response.json();
                    if(data.files && data.files.length) {
                        resultEl.innerText = 'PDF Split successfully. <br>';
                        const downloadLink = document.getElementById('downloadLink');
                        downloadLink.style.display ='none';
                        data.files.forEach(file => {
                            const link = document.createElement('a');
                            link.href = `http://localhost:3001/uploads/${file}`;
                            link.innerText = file.split('/').pop();
                            link.download = file.split('/').pop();
                            link.style.display = 'block';
                            resultEl.appendChild(link);
                        });
                    } else {
                        resultEl.innerText = "No split files found.";
                    }
                } catch (err) {
                    resultEl.innerText = 'Processing error:' + err.message;
                }
            }
        </script>
    </body>
</html>
