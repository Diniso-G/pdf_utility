<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PDF Utility Tool</title>
        <style>
            :root {
                --bg-start: #3b1c78;
                --bg-end: #7a3bc8;
                --ink: #2b2140;
                --lavender: #cdb9f0;
                --label: #c4a6f2;
                --muted: #8063bc;
                --warn-bg: #faeeda;
                --warn-ink: #633806;
                --err: #b3261e;
                --ok: #1f7a4d;
            }
            * {box-sizing: border-box;}
            html {min-height: 100%;background: var(--bg-end);}
            body {margin: 0; min-height: 100vh; color: var(--ink); font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialised;}
            h1 {margin: 0;font-size: 20px; font-weight: 700; color: #fff;}
            .app {max-width: 1000px; margin: 0 auto; padding: 40px 16px 32px;}
            .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 10px;}
            .grid .card {margin: 0;}
            .tagline {margin: 2px 0 0; font-size: 13px; color: var(--lavender);}
            .section-label {display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 10px; font-size: 11px; letter-spacing: 0.08em; color: var(--label);}
            .section-label.spaced {margin-top: 6px;}
            .status {display: inline-flex;align-items: center;gap: 6px;padding: 0; border: 0;background: none;cursor: pointer; font: inherit;font-size: 11px;letter-spacing:  0; color: var(--lavender);}
            .dot {width: 8px; height: 8px; border-radius: 50%; background: #a89bc4;}
            .dot.on {background: #5bd58b;}
            .dot.off {background: #ff8a80;}
            .card {display: block; width: 100%; margin: 0 0 18px; padding: 14px; border: 0; border-radius: 10px; background: #fff; color: inherit; font: inherit; text-align: left;}
            .action {cursor: pointer; transition: box-shadow 0.15s ease; transform:  0.08s ease;}
            .action:hover {box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);}
            .action:active {transform: scale(0.99);}
            .action:focus-visible, .action:focus-within {outline: 3px solid #fff; outline-offset: 2px;}
            .action:disabled {opacity: 0.6; cursor: pointer;}
            .action-title {display: block; font-size: 14px; font-weight: 700; color: var(--ink);}
            .action-sub {display: block; margin-top: 2px; font-size: 12px; color: var(--muted);}
            
            .warning {display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; background: var(--warn-bg); color: var(--warn-ink); font-size: 12px; line-height: 1.4;}
            .warning p {margin: 0;}
            #resultText {margin: 0;font-size: 12px; color: var(--muted); overflow-wrap: anywhere;}
            #resultText.ok {color: var(--ok);}
            #resultText.err {color: var(--err);}
            .links {display: flex; gap: 8px; margin-top: 10px; padding-bottom: 4px; overflow-x: auto;}
            .links:empty {display: none;}
            .links a {flex: none;padding: 8px 14px; border-radius: 8px;background: #efe7fa; color: #4b2a8a; font-size: 13px; font-weight: 600;text-decoration: none;}
            .links a:hover {background: #e3d6f6;}
            .links a:focus-visible {outline: 3px solid #4b2a8a; outline-offset: 2px;}
        </style>
    </head>
    <body>
        <main class="app">
            <header class="header">
                <div>
                    <h1> PDF Utility Tool</h1>
                    <p class="tagline">Select, Add Numbers, Merge & Split</p>
                </div>
            </header>

            <p class="section-label">ACTIONS</p>
            <div class="grid">
            <label class="card action" for="pdfInput">
                <span class="action-title">Select PDFs</span>
                <span class="action-sub" id="pdfSub">Choose one or more PDF files</span>
                <input class="sr-only" type="file" id="pdfInput" accept="application/pdf,.pdf" multiple>
            </label>

            <button class="card action" type="button" id="btnNumbers">
                <span class="action-title">Add page numbers</span>
                <span class="action-sub">Number every page of the selected PDF</span>
            </button>

            <button class="card action" type="button" id="btnMerge">
                <span class="action-title">Merge PDFs</span>
                <span class="action-sub">Combine the selected PDFs into one, in the order chosen</span>
            </button>

            <button class="card action" type="button" id="btnSplit">
                <span class="action-title">Split PDF</span>
                <span class="action-sub">Seperate the PDF into individual pages</span>
            </button>
            </div>

            <div class="section-label spaced">
                <span>WORD TO PDF (REQUIRES SERVER)</span>
                <button class="status" type="button" id="serverStatus" title="Check the server again">
                    <span class="dot" id="serverDot"></span><span id="serverText">Checking server...</span>
                </button>
            </div>

            <div class="grid">
            <label class="card action" for="wordInput">
                <span class="action-title">Select Word Document</span>
                <span class="action-sub" id="wordSub">Choose a .docx file to convert</span>
                <input class="sr-only" type="file" id="wordInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            </label>

            <button class="card action" type="button" id="btnConvert">
                <span class="action-title">Convert to PDF</span>
                <span class="action-sub">Send the file to your sever for conversion</span>
            </button>
            </div>
        
            <div class="card warning">
                <p>Download or save your files after splitting before continuing.</p>
            </div>

            <div class="card" id="resultCard">
                <p id="resultText" role="status" aria-live="polite">Results will appear after action.</p>
                <div class="links" id="resultLinks"></div>
            </div>
        </main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
        <script>
            const API_BASE = 'http://localhost:3000';
            const $ = (id) => document.getElementById(id);

            let pdfFiles = [];
            let wordfFiles = null;
            let busy = false;
            let objectUrls = [];

            function setResult(message, kind = '') {
                const el = $('resultText');
                el.textContent = message;
                el.className = kind;
            }

            function clearLinks() {
                objectUrls.forEach((u) => URL.revokeObjectURL(u));
                objectUrls = [];
                $('resultLinks').replaceChildren();
            }

            function addLink(label, bytesOrBlob, filename) {
                const blob = bytesOrBlob instanceof Blob ? bytesOrBlob : new Blob([bytesOrBlob], {type: 'application/pdf'});
                const url = URL.createObjectURL(blob);
                objectUrls.push(url);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.textContent = label;
                $('resultLinks').appendChild(a);
            }

            function setBusy(state) {
                busy = state;
                document.querySelectorAll('button.action').forEach((b) => {b.disabled = state;});
            }

            function friendlyError(err) {
                if (err instanceof TypeError) {
                    return `Could not reach the server at ${API_BASE}. Check that it is running (npm start) and try again.`;
                }
                return err.message || 'Something went wrong.';
            }

            async function run(message, task) {
                if (busy) return;
                setBusy(true);
                clearLinks();
                setResult(message);
                try {
                    await task();
                } catch (err) {
                    console.error(err);
                    setResult(friendlyError(err), 'err');
                } finally {
                    setBusy(false);
                }
            }

            function pdfLib() {
                if (!window.PDFLib) throw new Error('The PDF library did not load. Check your internet connection and refresh.');
                return window.PDFLib;
            }

            function requiredPdfs(min = 1) {
                if (pdfFiles.length < min) {
                    throw new Error(min > 1 ? `Select at least ${min} PDFs first.` : 'Please select PDF/s first.');
                }
            }

            const baseName = (name) => name.replace(/\.[^.]+$/,'');

            $('pdfInput').addEventListener('change', (e) => {
                pdfFiles = [...e.target.files].filter((f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
                const n = pdfFiles.length;
                $('pdfSub').textContent = n ? `${n} PDF${n > 1 ? 's' : ''} selected` : 'Choose one or mpre PDF files';
                clearLinks();
                setResult(n ? `${n} PDF(s) selected.` : 'No PDFs selected.');
            });

            $('wordInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && /\.docx$/i.test(file.name)) {
                    wordfFile = file;
                    $('wordSub').textContent = file.name;
                    clearLinks();
                    setResult('Word document selected.');
                } else {
                    wordfFile = null;
                    
                    $('wordSub').textContent = 'Choose a .docx file to convert';
                    setResult('Only .docx files are supported.', 'err');
                }
            });

            $('btnNumbers').addEventListener('click', () => run('Adding page numbers...', async () => {
                const {PDFDocument, StandardFonts, rgb} = pdfLib();
                requiredPdfs();
                for (const file of pdfFiles){
                    const doc = await PDFDocument.load(await file.arrayBuffer());
                    const font = await doc.embedFont(StandardFonts.HelveticaBold);
                    doc.getPages().forEach((page, i) => {
                        const {width} = page.getSize();
                        page.drawText(String(i + 1), {x: width - 50, y: 20, size: 12, font, color: rgb(0, 0, 0)});
                    });
                    addLink(`${file.name} (numbered)`, await doc.save(), `numbered_${file.name}`);
                }
                setResult('Page numbers added. Download your files below.', 'ok');
            }));

            $('btnMerge').addEventListener('click', () => run('Merging PDFs...', async () => {
                const {PDFDocument} = pdfLib();
                requiredPdfs(2);
                const merged = await PDFDocument.create();
                for (const file of pdfFiles){
                    const src = await PDFDocument.load(await file.arrayBuffer());
                    const pages = await merged.copyPages(src, src.getPageIndices());
                    pages.forEach((p) => merged.addPage(p));
                }
                addLink('Download merged.pdf', await merged.save(), 'merged.pdf');
                setResult(`Merged ${pdfFiles.length} PDFs into one.`, 'ok');
            }));

            $('btnSplit').addEventListener('click', () => run('Splitting PDFs...', async () => {
                const {PDFDocument} = pdfLib();
                requiredPdfs(); 
                let total = 0;
                for (const file of pdfFiles){
                    const src = await PDFDocument.load(await file.arrayBuffer());
                    const base = baseName(file.name);
                    for (const i of src.getPageIndices()) {
                        const single = await PDFDocument.create();
                        const [page] = await single.copyPages(src, [i]);
                        single.addPage(page);
                        const label = pdfFiles.length > 1 ? `${base} - Page ${i + 1}` : `Page ${i + 1}`;
                        addLink(label, await single.save(), `${base}_page_${i + 1}.pdf`);
                        total++;
                    }
                }
                setResult(`PDF split into ${total} pages.`, 'ok');
            }));

            async function serverError(response, fallback) {
                try {
                    const data = await response.json();
                    if (data && data.error) return `${fallback}: ${data.error}`;
                } catch (_) {/*response was not JSON*/}
                return `${fallback} (code ${response.status})`;
            }

            $('btnConvert').addEventListener('click', () => run('Converting Word document to PDF...', async () => {
                if (!wordfFile) throw new Error('Please select a Word document first');
                const form = new FormData();
                form.append('file', wordfFile, wordfFile.name);
                const upload = await fetch(`${API_BASE}/api/pdf/upload`, {method: 'POST', body: form});
                if (!upload.ok) throw new Error(await serverError(upload, 'Upload failed'));
                const { fileID} = await upload.json();

                const process = await fetch(`${API_BASE}/api/pdf/process`, {method: 'POST', headers:{'Content-Type': 'application/json'}, body: JSON.stringify({fileID, operation: 'docxToPDF'})});
                if (!process.ok) throw new Error(await serverError(process, 'Conversion failed'));
                const { resultID} = await process.json();

                const open = await fetch(`${API_BASE}/api/pdf/open/${resultID}`);
                if (!open.ok) throw new Error(await serverError(open, 'Download failed'));
                const blob = await open.blob();

                const outName = `${baseName(wordfFile.name)}.pdf`;
                addLink(`Download ${outName}`, blob, outName);
                setResult('Word document converted to PDF.', 'ok');
                setServerStatus(true);
            }));

            function setServerStatus(online) {
                $('serverDot').className = `dot ${online ? 'on' : 'off'}`;
                $('serverText').textContent = online ? 'Server online' : 'Server offline';
            }

            async function checkServer() {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 3000);
                try {
                    const res = await fetch(`${API_BASE}/`, {signal: controller.signal});
                    setServerStatus(res.ok);
                } catch (_) {
                    setServerStatus(false);
                } finally {
                    clearTimeout(timer);
                }
            }

            $('serverStatus').addEventListener('click', checkServer);
            checkServer();
            setInterval(checkServer, 15000);

        </script>
    </body>
</html>
